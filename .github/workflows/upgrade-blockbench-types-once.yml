name: Patch Blockbench Type Transitves Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/upgrade-blockbench-types-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: Local
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install current lockfile
        run: bun install --frozen-lockfile

      - name: Pin patched transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            const path = "package.json";
            const pkg = await Bun.file(path).json();
            if (pkg.devDependencies?.["blockbench-types"] !== "5.1.0") {
              throw new Error("Expected blockbench-types to remain pinned at 5.1.0");
            }
            pkg.overrides = {
              ...(pkg.overrides ?? {}),
              electron: "41.10.7",
              postcss: "8.5.28",
              nanoid: "3.3.19"
            };
            await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n");
          '
          bun install

      - name: Audit high-severity advisories
        run: bun audit --audit-level=high

      - name: Verify type contracts
        run: bun run verify:types

      - name: Verify runtime contracts
        run: bun run test:runtime

      - name: Commit dependency security closure
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/package.json mcp/bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): patch Blockbench type transitive advisories"
          git push origin HEAD:Local
