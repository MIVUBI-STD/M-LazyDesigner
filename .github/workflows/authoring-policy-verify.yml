name: Authoring Policy Verify

on:
  push:
    branches:
      - Local
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - ".agents/skills/lazydesigner-reference-preparation/**"
      - ".agents/skills/lazydesigner-prompt-compiler/**"
      - ".agents/skills/lazydesigner-modelling/**"
      - ".agents/skills/lazydesigner-texturing/**"
      - ".agents/skills/lazydesigner-animation/**"
      - "docs/02-reference/**"
      - "docs/03-authoring/**"
      - "docs/04-system/implementation-map.md"
      - "docs/04-system/control/**"
      - "docs/05-operations/local-acceptance-runbook.md"
      - "workspace/README.md"
      - "workspace/active/**"
      - "mcp/gateway/control/**"
      - "mcp/lib/authoringPhase.ts"
      - "mcp/tests/authoring/**"
      - ".github/workflows/authoring-policy-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Static authoring contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install test dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify authoring policy and routing
        run: bun run verify:authoring
