name: Remote Acceptance

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - ".agents/skills/lazydesigner-*/**"
      - "docs/03-authoring/**"
      - "docs/04-system/**"
      - "docs/05-operations/**"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
      - ".github/workflows/remote-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Exact-SHA remote acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact SHA
        working-directory: .
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          {
            echo "### Remote acceptance proof"
            echo
            echo "- exact_sha: `$actual_sha`"
            echo "- gate: `bun run verify:remote`"
            echo "- live_local_tests: excluded"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Run canonical remote acceptance
        run: bun run verify:remote
