name: MCP Verify

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - "!mcp/AGENTS.md"
      - "!mcp/README.md"
      - "!mcp/about.md"
      - "!mcp/gateway/README.md"
      - "!mcp/llms.txt"
      - "!mcp/tests/repository/**"
      - "!mcp/tests/authoring/**"
      - "!mcp/prompts/blockbench_code_eval_safety.md"
      - "!mcp/prompts/blockbench_native_apis.md"
      - ".agents/skills/lazydesigner-modelling/**"
      - ".agents/skills/lazydesigner-texturing/**"
      - ".agents/skills/lazydesigner-animation/**"
      - "docs/05-operations/next-action.md"
      - ".bun-version"
      - ".github/workflows/mcp-verify.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      # Canonical full-gate composition remains explicit here for repository
      # ownership/audit visibility. Affected mode selects the minimum safe subset;
      # full mode executes verify:full, whose verify:mcp owner contains:
      # bun run docs:check
      # bun run typecheck
      # bun run typecheck:gateway
      # bun run test:runtime
      # bun run verify:authoring
      # bun run benchmark:semantic-invalidation-scope
      # bun run measure:surface
      # bun run measure:phases
      # bun run build
      - name: Plan verification scope
        id: scope
        shell: bash
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          full_verify() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            : > /tmp/mcp-changed-paths.txt
          }

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "Manual/non-push verification uses the canonical full verifier."
            full_verify
            exit 0
          fi

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "Push has no trustworthy before SHA; failing wide."
            full_verify
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "Before SHA is unavailable locally; failing wide."
            full_verify
            exit 0
          fi

          git diff --name-status --find-renames "$BEFORE_SHA" "$HEAD_SHA" > /tmp/mcp-change-status.txt

          if grep -Eq '^(D|R|C)[0-9]*[[:space:]]' /tmp/mcp-change-status.txt; then
            echo "Deletion/rename/copy detected; ownership may have disappeared, so use full verification."
            full_verify
            exit 0
          fi

          awk -F '\t' '{print $NF}' /tmp/mcp-change-status.txt | sed '/^$/d' | sort -u > /tmp/mcp-changed-paths.txt

          if [[ ! -s /tmp/mcp-changed-paths.txt ]]; then
            echo "No changed paths resolved; failing wide."
            full_verify
            exit 0
          fi

          echo "Affected verification paths:"
          cat /tmp/mcp-changed-paths.txt

          mapfile -t changed_paths < /tmp/mcp-changed-paths.txt
          (
            cd mcp
            bun run plan:affected -- "${changed_paths[@]}"
          ) > /tmp/mcp-affected-plan.json

          planner_full="$(bun -e 'const p=JSON.parse(await Bun.file("/tmp/mcp-affected-plan.json").text()); console.log(p.execution.fallback_full_verify ? "true" : "false")')"
          if [[ "$planner_full" == "true" ]]; then
            echo "Affected planner requested canonical full verification."
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=affected" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "### MCP verification plan"
            echo
            echo '~~~json'
            cat /tmp/mcp-affected-plan.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run affected verification
        if: steps.scope.outputs.mode == 'affected'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < /tmp/mcp-changed-paths.txt
          bun run verify:affected -- "${changed_paths[@]}"

      - name: Run full verification
        if: steps.scope.outputs.mode == 'full'
        run: bun run verify:full

      # Keep verified build artifacts only when the canonical full verifier ran.
      # Affected-only pushes intentionally avoid rebuilding unrelated bundles.
      - name: Record exact-SHA build provenance
        if: steps.scope.outputs.mode == 'full'
        run: bun run ./scripts/verified-build-artifact.ts write-ci

      - name: Upload verified compatibility bundle
        if: steps.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blockit-mcp-verified
          path: |
            mcp/dist/blockit_mcp.js
            mcp/dist/blockit-build-provenance.json
          if-no-files-found: error
          retention-days: 14
