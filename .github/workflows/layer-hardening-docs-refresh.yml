name: Layer Hardening Docs Refresh

on:
  push:
    branches:
      - Local

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Install
        working-directory: mcp
        run: bun install --frozen-lockfile
      - name: Generate API docs
        working-directory: mcp
        run: bun run docs:build
      - name: Commit generated docs
        shell: bash
        run: |
          if git diff --quiet -- mcp/docs/api.json mcp/docs/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html
          git commit -m "chore: refresh generated MCP docs"
          git push origin HEAD:Local
