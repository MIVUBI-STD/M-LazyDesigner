name: Regenerate MCP Artifacts Once

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/regenerate-mcp-artifacts-once.yml"

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Regenerate owned artifacts
        working-directory: mcp
        run: |
          bun run docs:build
          bun run prompts:build
          bun run generate:hybrid4-schemas

      - name: Upload generated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regenerated-mcp-artifacts
          path: |
            mcp/docs/api.json
            mcp/docs/index.html
            mcp/prompts/manifest.json
            mcp/gateway/experimental/generated/hybrid4Schemas.ts
          if-no-files-found: error
          retention-days: 1
