name: Regenerate MCP Artifacts Once

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/regenerate-mcp-artifacts-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'ci: regenerate MCP artifacts once'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: Local
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Regenerate owned artifacts
        working-directory: mcp
        run: |
          bun run docs:build
          bun run prompts:build
          bun run generate:hybrid4-schemas

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json mcp/gateway/experimental/generated/hybrid4Schemas.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts already fresh."
            exit 0
          fi
          git commit -m "chore(generated): refresh MCP artifacts"
          git push origin HEAD:Local
