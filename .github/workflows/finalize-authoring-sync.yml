name: Final Synchronization Verification

# Synchronization trigger: 2026-09-18 MCP maturity hardening pass 3.
on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/finalize-authoring-sync.yml"

permissions:
  contents: write

jobs:
  verify-final-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout committed Local source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install exact dependencies
        working-directory: mcp
        run: bun install --frozen-lockfile

      - name: Guard single native authoring path
        run: |
          if grep -RniE '3D_ASSISTED|threeDAssisted|Hunyuan|PrimitiveAnything|materialize_3d_assisted|manage_geometry_reference|reference_envelope_fidelity' \
            mcp/server mcp/lib mcp/gateway .agents/skills mcp/prompts \
            --exclude='*.test.ts'; then
            echo 'Retired authoring identifiers remain in active source.' >&2
            exit 1
          fi

      - name: Verify routed schema zero-loss contract
        working-directory: mcp
        run: bun test tests/tool-factory-zero-loss.test.ts

      - name: Verify particle texture output contract
        working-directory: mcp
        run: bun test tests/particle-end-to-end-static-contract.test.ts

      - name: Regenerate canonical MCP documentation
        working-directory: mcp
        run: bun run docs:build

      - name: Commit generated documentation when changed
        run: |
          if git diff --quiet -- mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json; then
            echo "Canonical generated outputs already match source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json
          git commit -m "docs: regenerate MCP artifacts"
          git push origin HEAD:Local

      - name: Verify full synchronized repository
        working-directory: mcp
        run: bun run verify:full

      - name: Remove transient verification workflow
        run: |
          rm .github/workflows/finalize-authoring-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-authoring-sync.yml
          git commit -m "ci: remove completed synchronization verifier"
          git push origin HEAD:Local
