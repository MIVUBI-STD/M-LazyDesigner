name: Remote Closure Once

on:
  push:
    branches:
      - Local
    paths:
      - "mcp/**"
      - ".agents/skills/lazydesigner-modelling/**"
      - ".agents/skills/lazydesigner-texturing/**"
      - ".agents/skills/lazydesigner-animation/**"
      - ".github/workflows/remote-closure-once.yml"

concurrency:
  group: remote-closure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify full remote contract
        run: bun run verify:remote
