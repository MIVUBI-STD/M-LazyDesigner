name: MCP v2 Migration Closure

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/mcp-v2-migration.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # rerun: zod4 typing closure 3
    steps:
      - name: Checkout Local
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Refresh exact dependency graph
        working-directory: mcp
        run: bun install

      - name: Regenerate canonical generated artifacts
        working-directory: mcp
        run: |
          bun run docs:build
          bun run prompts:build

      - name: Commit lockfile and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- mcp/bun.lock mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json; then
            git add mcp/bun.lock mcp/docs/api.json mcp/docs/index.html mcp/prompts/manifest.json
            git commit -m "chore(mcp): synchronize SDK v2 generated artifacts"
            git push origin HEAD:Local
          fi

      - name: Verify full MCP v2 repository
        working-directory: mcp
        run: bun run verify:full

      - name: Remove migration workflow after closure
        run: |
          rm .github/workflows/mcp-v2-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/mcp-v2-migration.yml
          git commit -m "ci: remove completed MCP v2 migration workflow"
          git push origin HEAD:Local
