name: MCP v2 Migration Baseline

on:
  push:
    branches: [Local]
    paths:
      - ".github/workflows/mcp-v2-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Local
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Apply official MCP v1 to v2 codemod
        working-directory: mcp
        run: bunx @modelcontextprotocol/codemod@latest v1-to-v2 .

      - name: Require supported Zod 4 authoring schemas
        working-directory: mcp
        run: bun add zod@^4.2.0

      - name: Resolve exact dependency graph
        working-directory: mcp
        run: bun install

      - name: Commit mechanical migration baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Codemod produced no changes."
            exit 1
          fi
          git add mcp
          git commit -m "refactor(mcp): apply official SDK v2 migration baseline"
          git push origin HEAD:Local
