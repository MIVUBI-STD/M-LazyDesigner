name: Repository Verify

on:
  push:
    branches:
      - Local
    paths:
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"
      - "GITHUB_RULES.md"
      - "CONTEXT.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".agents/skills/lazydesigner-development-brief/**"
      - ".agents/skills/lazydesigner-mcp-development/**"
      - ".agents/skills/lazydesigner-blockbench-development/**"
      - "docs/**"
      - "mcp/AGENTS.md"
      - "mcp/README.md"
      - "mcp/about.md"
      - "mcp/gateway/README.md"
      - "mcp/llms.txt"
      - "mcp/package.json"
      - "mcp/tests/repository/**"
      - "mcp/prompts/blockbench_code_eval_safety.md"
      - "mcp/prompts/blockbench_native_apis.md"
      - "Experimental/README.md"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static repository policy/ownership only; executable MCP and packaged Windows
  # verification remain separate gates and are compared only on the same source SHA;
  # packaged authoring instructions must follow the same active ownership model.
  verify:
    name: Static repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ".bun-version"

      - name: Verify repository routing and policy
        run: bun run verify:repository
